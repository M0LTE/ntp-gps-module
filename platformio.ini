; NTP -> GPS emulator for the mitxela Precision Clock Mk II / II½ (rev 3b)
; ESP32-C3 with native USB (USB-Serial/JTAG) console.

[env:esp32c3]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM13
monitor_port = COM13
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
